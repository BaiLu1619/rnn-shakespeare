# Paths
data_dir: data/tinyshakespeare

# Dataset
sequence_length: 100
train_fraction: 0.90
validation_fraction: 0.05

# Model
embedding_dim: 128
hidden_dim: 256
num_layers: 1
dropout: 0.0

# Training
epochs: 20
batch_size: 64
learning_rate: 0.002
weight_decay: 0.0
grad_clip: 1.0

# Runtime and generation
seed: 42
prompt: "ROMEO:"
generation_length: 500
temperature: 0.8
